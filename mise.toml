[tools]
bun = "1.4.3"
# Lint rule tests only: oxlint's RuleTester does not run under Bun.
node = "24.22.0"

[env]
FALLOW_FORMAT = "compact"
FALLOW_QUIET = "1"
RUST_LOG = "error"

[settings]
# Type checking and type-aware lint are memory heavy; run tasks one at a time.
jobs = 1
task.quiet = true

# JS tools run from node_modules; --no-install fails instead of downloading.
# tools/quiet.ts prints nothing on success and the command's output on failure.

[tasks.setup]
description = "Install dependencies and patch the TypeScript compiler"
run = "bun install"

[tasks.check]
description = "Run every read-only check"
depends = [
  "check:mise",
  "check:fmt",
  "check:lint",
  "check:types",
  "check:anatomy",
  "check:reference",
  "fallow:dead-code",
  "fallow:dupes",
  "test",
  "test:tools",
]

[tasks."check:mise"]
description = "Validate mise tasks"
run = "bun tools/quiet.ts mise tasks validate --errors-only"

[tasks."check:fmt"]
description = "Check formatting"
run = "bunx --bun --no-install oxfmt --list-different"

[tasks."check:lint"]
description = "Type-aware oxlint with Liminal rules"
run = "bunx --bun --no-install oxlint --type-aware --deny-warnings --disable-nested-config --format=agent"

[tasks."check:types"]
description = "Types and Effect diagnostics with the patched compiler"
run = "bunx --bun --no-install tsc --noEmit"

[tasks.docs]
description = "Copy version-matched dependency docs into docs/reference/copies/ and rebuild the index"
run = "bun tools/reference/sync.ts"

[tasks."check:reference"]
description = "Every dependency has reference docs matching its pinned version"
run = "bun tools/reference/check.ts"

[tasks."check:anatomy"]
description = "Plugin package anatomy"
run = "bun tools/checks/plugin-anatomy.ts"

[tasks."fallow:dead-code"]
description = "Unused files, exports and dependencies, cycles and import boundaries"
run = "bun tools/quiet.ts bunx --bun --no-install fallow dead-code --fail-on-issues"

[tasks."fallow:dupes"]
description = "Duplicated code"
run = "bun tools/quiet.ts bunx --bun --no-install fallow dupes --fail-on-issues"

[tasks.test]
description = "Workspace tests"
run = "bun tools/quiet.ts bun test ./apps ./kernel ./sdk ./plugins --pass-with-no-tests --only-failures"

[tasks."test:tools"]
description = "Lint rule and check tests under Node"
run = "bun tools/quiet.ts node --test --test-reporter=dot \"tools/**/*.test.ts\""

[tasks."fix:fmt"]
description = "Format the given files"
run = "bunx --bun --no-install oxfmt --write"

[tasks."fix:lint"]
description = "Apply safe lint fixes to the given files"
run = "bunx --bun --no-install oxlint --type-aware --disable-nested-config --format=agent --fix"
